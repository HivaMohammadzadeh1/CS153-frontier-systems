[project]
name = "learning-memory-os"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HivaMohammadzadeh1", email = "hivamoh688@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "aiofiles>=25.1.0",
    "anthropic>=0.102.0",
    "bitsandbytes>=0.49.2",
    "datasets>=4.8.5",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "json5>=0.14.0",
    "matplotlib>=3.10.9",
    "openai>=2.36.0",
    "peft>=0.19.1",
    "pgvector>=0.4.2",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "pyyaml>=6.0.3",
    "streamlit>=1.57.0",
    "streamlit-mermaid>=0.3.0",
    "structlog>=25.5.0",
    "torch>=2.12.0",
    "transformers>=5.8.1",
    "typer>=0.25.1",
    "uvicorn>=0.47.0",
]

[project.scripts]
learning-memory-os = "learning_memory_os:main"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = [".", "src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "playwright>=1.60.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-postgresql>=8.0.0",
    "ruff>=0.15.12",
]
