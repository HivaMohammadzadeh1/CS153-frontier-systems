version: 1
description: "Memex ML-systems curriculum — 38 topics across 7 areas"

# Teaching sequence (interview-prep order, applied in the UI via the area ranking):
#   A fundamentals + resource accounting → C inference serving → B training systems
#   → F production ops/observability/cost → D data & alignment → E agents → G design.
# This is inference-first on purpose: the ML-infra interview bar lives in serving, so
# the serving stack is taught right after fundamentals, not after all of training.
areas:
  A: "Model fundamentals (CS336 L1-L4)"
  B: "Training systems (CS336 L5-L8, L11)"
  C: "Inference infrastructure (CS349D + CS336 L10)"
  D: "Data & alignment (CS336 L13-L17)"
  E: "Agent systems & frontier framing (CS153 + project recursion)"
  F: "Production ML systems (training ops, serving, observability, cost)"
  G: "ML System Design (recsys, search, ads, newsfeed, anomaly, vector DB)"

topics:
  - id: tokenization
    area: A
    title: "Tokenization (BPE, byte-level)"
    sources:
      - "data/seed_topics/tokenization/source.md"
      - "data/curriculum/cs336_l01_overview.md"
    prerequisites: []

  - id: transformer_architecture
    area: A
    title: "Transformer architecture & hyperparameters"
    sources:
      - "data/curriculum/cs336_l03_architecture.md"
    prerequisites: [tokenization]

  # Resource accounting is taught EARLY — quantitative reasoning (FLOPs, memory
  # bandwidth, arithmetic intensity) is the load-bearing skill the whole inference
  # curriculum builds on, so it comes before attention variants.
  - id: resource_accounting
    area: A
    title: "Resource accounting (FLOPs, memory, arithmetic intensity)"
    sources:
      - "data/curriculum/cs336_l02_resource_accounting.md"
    prerequisites: [transformer_architecture]

  - id: attention_moe
    area: A
    title: "Attention variants & MoE"
    sources:
      - "data/curriculum/cs336_l04_attention_moe.md"
    prerequisites: [transformer_architecture]

  - id: gpu_kernels
    area: B
    title: "GPU/TPU hardware & kernels (Triton, FlashAttention2)"
    sources:
      - "data/curriculum/cs336_l05_gpus_tpus.md"
      - "data/curriculum/cs336_l06_kernels.md"
    prerequisites: [resource_accounting]

  - id: data_parallelism
    area: B
    title: "Data parallelism (DDP)"
    sources:
      - "data/seed_topics/data_parallelism/source.md"
      - "data/curriculum/cs336_l07_parallelism.md"
    prerequisites: [resource_accounting]

  - id: sharded_training
    area: B
    title: "Sharded training (FSDP, ZeRO-1/2/3)"
    sources:
      - "data/curriculum/cs336_l08_parallelism.md"
    prerequisites: [data_parallelism]

  - id: model_parallelism
    area: B
    title: "Model parallelism (tensor + pipeline)"
    sources:
      - "data/curriculum/cs336_l08_parallelism.md"
    prerequisites: [sharded_training]

  - id: scaling_laws
    area: B
    title: "Scaling laws"
    sources:
      - "data/curriculum/cs336_l09_scaling.md"
      - "data/curriculum/cs336_l11_scaling.md"
    prerequisites: [resource_accounting]

  - id: kv_cache
    area: C
    title: "KV cache & PagedAttention"
    sources:
      - "data/seed_topics/kv_cache/source.md"
      - "data/seed_topics/cs336_l10_inference/source.md"
    prerequisites: [attention_moe]

  # Serving loop first (how requests actually flow), THEN quantization — the
  # expert's inference teaching order: KV cache → batching → prefill/decode
  # disaggregation → speculative decoding → quantization.
  - id: continuous_batching
    area: C
    title: "Continuous batching & request scheduling"
    sources:
      - "data/seed_topics/cs336_l10_inference/source.md"
      - "data/curriculum/cs349d_batching.md"
    prerequisites: [kv_cache]

  - id: prefill_decode_disagg
    area: C
    title: "Prefill-decode disaggregation & hierarchical caching"
    sources:
      - "data/curriculum/cs349d_disaggregation.md"
    prerequisites: [continuous_batching]

  - id: speculative_decoding
    area: C
    title: "Speculative decoding"
    sources:
      - "data/seed_topics/cs336_l10_inference/source.md"
      - "data/curriculum/cs349d_speculative.md"
    prerequisites: [kv_cache]

  - id: quantization
    area: C
    title: "Quantization (int8/int4, GPTQ/AWQ)"
    sources:
      - "data/seed_topics/cs336_l10_inference/source.md"
      - "data/curriculum/cs349d_quantization.md"
    prerequisites: [resource_accounting]

  - id: pretraining_data
    area: D
    title: "Pretraining data (collection, dedup, filtering)"
    sources:
      - "data/curriculum/cs336_l13_data.md"
      - "data/curriculum/cs336_l14_data.md"
    prerequisites: [tokenization]

  - id: sft_rlhf_dpo
    area: D
    title: "SFT + RLHF / DPO"
    sources:
      - "data/curriculum/cs336_l15_alignment.md"
    prerequisites: [pretraining_data]

  - id: rl_systems
    area: D
    title: "RL systems for reasoning"
    sources:
      - "data/curriculum/cs336_l16_rl.md"
      - "data/curriculum/cs336_l17_rl_systems.md"
    prerequisites: [sft_rlhf_dpo]

  - id: agent_memory
    area: E
    title: "Agent memory architectures"
    sources:
      - "data/seed_topics/agent_memory/source.md"
      - "data/curriculum/cs153_agents_framing.md"
    prerequisites: []

  - id: context_selection
    area: E
    title: "Context selection under budgets"
    sources:
      - "data/curriculum/agents_context_selection.md"
    prerequisites: [agent_memory]

  - id: multi_agent_orchestration
    area: E
    title: "Multi-agent orchestration & long-horizon execution"
    sources:
      - "data/curriculum/agents_orchestration.md"
    prerequisites: [context_selection]

  - id: training_orchestration
    area: B
    title: "Training orchestration (Ray, Slurm, K8s)"
    sources:
      - "data/curriculum/training_orchestration.md"
    prerequisites: [data_parallelism]

  - id: multi_node_networking
    area: B
    title: "Multi-node networking (InfiniBand, NVLink, RDMA, collectives)"
    sources:
      - "data/curriculum/multi_node_networking.md"
    prerequisites: [data_parallelism]

  - id: serving_patterns
    area: C
    title: "Serving patterns (canary, shadow, blue-green, versioning)"
    sources:
      - "data/curriculum/serving_patterns.md"
    prerequisites: [kv_cache]

  - id: compiler_optimizations
    area: C
    title: "Compiler optimizations (XLA, TorchInductor, ONNX, MLIR)"
    sources:
      - "data/curriculum/compiler_optimizations.md"
    prerequisites: [gpu_kernels]

  - id: observability_for_ml
    area: F
    title: "Observability for ML (logging, tracing, metrics, drift)"
    sources:
      - "data/curriculum/observability_for_ml.md"
    prerequisites: [serving_patterns]

  - id: feature_stores
    area: F
    title: "Feature stores (online/offline split, embeddings, freshness)"
    sources:
      - "data/curriculum/feature_stores.md"
    prerequisites: [pretraining_data]

  - id: cost_optimization
    area: F
    title: "Cost optimization (spot, mixed precision, GPU utilization, FinOps)"
    sources:
      - "data/curriculum/cost_optimization.md"
    prerequisites: [resource_accounting]

  - id: multi_tenant_inference
    area: F
    title: "Multi-tenant inference (queueing, fairness, SLA, quotas)"
    sources:
      - "data/curriculum/multi_tenant_inference.md"
    prerequisites: [continuous_batching]

  # Area G — ML System Design
  - id: recommendation_systems
    area: G
    title: "Recommendation Systems (two-tower, ranking, exploration)"
    sources:
      - "data/curriculum/recommendation_systems.md"
    prerequisites: [data_parallelism]

  - id: search_systems
    area: G
    title: "Search Systems (BM25, semantic, hybrid retrieval, LTR)"
    sources:
      - "data/curriculum/search_systems.md"
    prerequisites: [kv_cache]

  - id: ad_systems
    area: G
    title: "Ad Systems (auction, CTR, calibration, RTB)"
    sources:
      - "data/curriculum/ad_systems.md"
    prerequisites: [recommendation_systems]

  - id: newsfeed_ranking
    area: G
    title: "Newsfeed Ranking (multi-stage, position bias, freshness)"
    sources:
      - "data/curriculum/newsfeed_ranking.md"
    prerequisites: [recommendation_systems]

  - id: anomaly_detection_systems
    area: G
    title: "Anomaly Detection Systems (isolation forest, autoencoder, fraud)"
    sources:
      - "data/curriculum/anomaly_detection_systems.md"
    prerequisites: [feature_stores]

  - id: vector_database_design
    area: G
    title: "Vector Database Design (HNSW, IVF-PQ, sharding, hybrid search)"
    sources:
      - "data/curriculum/vector_database_design.md"
    prerequisites: [attention_moe]

  # Extensions to existing areas
  - id: rag_architecture
    area: E
    title: "RAG Architecture (chunking, reranking, hybrid retrieval, semantic cache)"
    sources:
      - "data/curriculum/rag_architecture.md"
    prerequisites: [context_selection]

  - id: ab_testing_for_ml
    area: F
    title: "A/B Testing for ML (bandits, CUPED, IPS, doubly-robust)"
    sources:
      - "data/curriculum/ab_testing_for_ml.md"
    prerequisites: [observability_for_ml]

  - id: long_context_methods
    area: C
    title: "Long Context Methods (RoPE scaling, YaRN, ring attention, NIAH)"
    sources:
      - "data/curriculum/long_context_methods.md"
    prerequisites: [attention_moe]

  - id: data_pipelines_for_ml
    area: D
    title: "Data Pipelines for ML (Airflow, Beam, Flink, dbt, lineage)"
    sources:
      - "data/curriculum/data_pipelines_for_ml.md"
    prerequisites: [pretraining_data]
