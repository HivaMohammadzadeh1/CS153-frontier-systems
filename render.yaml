# Render Blueprint: a Docker web service. Uses an EXTERNAL Postgres (set
# DATABASE_URL in the dashboard) — e.g. a free Neon database — because Render
# allows only one free managed Postgres per account.
# Deploy: push to GitHub, then in Render → "New +" → "Blueprint" → pick this repo.
services:
  - type: web
    name: memex
    runtime: docker
    plan: free          # free web service (spins down when idle)
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # paste your Postgres URL (e.g. free Neon) here
        sync: false
      - key: COOKIE_SECURE
        value: "true"            # Render serves HTTPS
      # Secrets — set these in the dashboard (Environment tab):
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_BASE_URL          # e.g. https://memex.onrender.com (or your domain)
        sync: false
      - key: LMOS_PUBLIC_URL       # same value — used for Stripe success/cancel URLs
        sync: false
      - key: STRIPE_SECRET_KEY     # billing on once these three are set
        sync: false
      - key: STRIPE_PRICE_ID       # the $5 one-time price id
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
