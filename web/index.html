<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memex — ML Systems Tutor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('memex.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Hanken Grotesk', 'system-ui', 'sans-serif'], display: ['Bricolage Grotesque', 'Hanken Grotesk', 'sans-serif'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] } } },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="antialiased">

  <!-- ── Left nav rail ───────────────────────────────────────────── -->
  <nav id="rail" class="rail">
    <div class="rail-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-word">Memex</span>
    </div>

    <div class="rail-nav">
      <button class="nav-item" data-view="home"     title="Home">     <span class="nav-ico">🏠</span><span class="nav-label">Home</span></button>
      <button class="nav-item" data-view="profile"  title="Profile">  <span class="nav-ico">👤</span><span class="nav-label">Profile</span></button>
      <button class="nav-item" data-view="chat"     title="Chat">     <span class="nav-ico">💬</span><span class="nav-label">Chat</span></button>
      <button class="nav-item" data-view="progress" title="Progress"> <span class="nav-ico">📊</span><span class="nav-label">Progress</span></button>
      <button class="nav-item" data-view="path"     title="Path">     <span class="nav-ico">🎯</span><span class="nav-label">Path</span></button>
    </div>

    <div class="rail-foot">
      <div id="railStreak" class="streak-chip" title="Day streak">
        <span class="streak-flame">🔥</span><span id="streakCount">0</span>
      </div>
      <button id="themeToggle" class="rail-btn" title="Toggle dark mode"><span id="themeIcon">🌙</span></button>
      <details id="settingsMenu" class="rail-menu">
        <summary class="rail-btn" title="Settings">⚙️</summary>
        <div class="rail-popover">
          <label class="field-label">Student ID</label>
          <input id="studentIdInput" type="text" value="Hiva" class="field-input" />
        </div>
      </details>
    </div>
  </nav>

  <!-- ── Main column ─────────────────────────────────────────────── -->
  <main id="main" class="main">

    <!-- HOME / TODAY ------------------------------------------------- -->
    <section id="view-home" class="view" data-view="home"></section>

    <!-- PROFILE ------------------------------------------------------ -->
    <section id="view-profile" class="view" data-view="profile"></section>

    <!-- CHAT --------------------------------------------------------- -->
    <section id="view-chat" class="view view-chat" data-view="chat">
      <header class="chat-topbar">
        <details id="historyMenu" class="chat-menu">
          <summary class="topbar-btn">🗂️ History</summary>
          <div class="topbar-popover">
            <button id="newChatBtn" class="popover-action">＋ New chat</button>
            <div id="conversationList" class="conv-list"></div>
          </div>
        </details>
        <select id="topicSelect" class="topic-select" title="Focus a topic">
          <option value="">All topics</option>
        </select>
        <div class="topbar-spacer"></div>
        <button id="newChatTopBtn" class="topbar-btn" title="New chat">＋ New</button>
      </header>

      <div id="chatScroll" class="chat-scroll">
        <!-- Welcome-back banner -->
        <div id="welcomeBackBanner" class="welcome-back hidden">
          <span class="text-lg">👋</span>
          <span id="welcomeBackText" class="flex-1"></span>
          <button id="welcomeBackOpenMemory" class="link-btn">View progress →</button>
        </div>

        <!-- Welcome / empty state -->
        <section id="welcome" class="welcome">
          <h1 class="welcome-title">What do you want to learn?</h1>
          <p class="welcome-sub">Ask anything about ML systems engineering.</p>
          <div id="starterGrid" class="starter-grid"></div>
        </section>

        <!-- Messages -->
        <section id="chat" class="chat-thread"></section>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="msgInput" rows="1" placeholder="Message Memex…" class="composer-input"></textarea>
          <button id="sendBtn" disabled class="composer-send" title="Send">↑</button>
        </div>
        <div class="composer-hint">Enter to send · Shift+Enter for newline</div>
      </div>
    </section>

    <!-- PROGRESS ----------------------------------------------------- -->
    <section id="view-progress" class="view" data-view="progress"></section>

    <!-- PATH --------------------------------------------------------- -->
    <section id="view-path" class="view" data-view="path"></section>
  </main>

  <!-- ── Routing modal (per-answer context) ──────────────────────── -->
  <div id="routingModal" class="modal hidden">
    <div class="modal-backdrop" id="routingBackdrop"></div>
    <div class="modal-card modal-card-lg">
      <div class="modal-head">
        <h2 class="modal-title">Context for this answer</h2>
        <button id="routingClose" class="modal-close">&#x2715;</button>
      </div>
      <div id="routingBody" class="space-y-3 text-sm"></div>
    </div>
  </div>

  <!-- Confetti celebration layer -->
  <canvas id="confettiCanvas" aria-hidden="true"></canvas>

  <!-- Toast layer (level-up / streak) -->
  <div id="toastLayer" class="toast-layer"></div>

  <script src="/app.js"></script>
</body>
</html>
